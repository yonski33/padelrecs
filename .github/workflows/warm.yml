name: Warm caches
# After a production deploy of a kept site, visit its top ~50 pages once (scripts/warm.mjs), so the first visitors after a
# merge get cached pages instead of an 8–49 s first render (owner 2026-11-16). Vercel reports each site's deploy as a
# commit status ("Vercel – <project>"); only main's statuses are production deploys.
on:
  status:
jobs:
  warm:
    if: >-
      github.event.state == 'success' &&
      startsWith(github.event.context, 'Vercel – ') &&
      contains(github.event.branches.*.name, 'main') &&
      contains(fromJSON('["Vercel – padelrecs","Vercel – tennisrecs","Vercel – pickleballrecs","Vercel – simracingrecs","Vercel – discgolfrecs","Vercel – skinrecs"]'), github.event.context)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: warm-${{ github.event.context }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/warm.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The new deployment takes a few seconds to take over the domain after Vercel reports success.
      - run: sleep 30
      - name: Warm
        env:
          CONTEXT: ${{ github.event.context }}
        run: |
          project="${CONTEXT#Vercel – }"
          node scripts/warm.mjs "https://www.${project}.com" 50
